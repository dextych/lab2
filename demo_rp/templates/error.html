<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 16px; }
        .error { background: #fee; border: 1px solid #c0392b; border-radius: 6px; padding: 20px; }
        h2 { color: #c0392b; margin-top: 0; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
        a { color: #2d6cdf; }
    </style>
</head>
<body>
    <div class="error">
        <h2>Ошибка OIDC-флоу</h2>
        <p><strong>Код:</strong> <code>{{ error }}</code></p>
        {% if description %}<p><strong>Описание:</strong> {{ description }}</p>{% endif %}
        <p><a href="/">← На главную</a></p>
    </div>
</body>
</html>
