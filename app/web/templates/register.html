{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
    <h2>Регистрация</h2>
    
    <form method="POST" action="/web/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <p><label>Email:</label><br>
        <input type="email" name="email" required style="width: 100%;"></p>
        
        <p><label>Пароль:</label><br>
        <input type="password" name="password" required style="width: 100%;"></p>

        <p><label>Повторите пароль:</label><br>
        <input type="password" name="password_confirm" required style="width: 100%;"></p>
        
        <button type="submit">Зарегистрироваться</button>
    </form>
    <p><a href="/web/login">Уже есть аккаунт? Войти</a></p>
{% endblock %}
