{% extends "base.html" %}
{% block title %}Безопасность{% endblock %}
{% block content %}
    <h2>Смена пароля</h2>
    <a href="/web/account">Назад в профиль</a>

    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    {% if success %}<p style="color:green;">{{ success }}</p>{% endif %}

    <form method="POST" action="/web/account/security" style="margin-top: 20px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <p><label>Старый пароль:</label><br>
        <input type="password" name="old_password" required style="width: 100%;"></p>
        
        <p><label>Новый пароль:</label><br>
        <input type="password" name="new_password" required style="width: 100%;"></p>
        
        <p><label>Повторите новый пароль:</label><br>
        <input type="password" name="new_password_confirm" required style="width: 100%;"></p>
        
        <button type="submit">Изменить пароль</button>
    </form>
{% endblock %}
