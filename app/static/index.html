<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель Vault</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 16px; }
        h1 { margin-bottom: 24px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { display: block; width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; border: none; border-radius: 4px; background: #2d6cdf; color: white; cursor: pointer; font-size: 14px; }
        button:hover { background: #1e4fa8; }
        button.danger { background: #c0392b; }
        button.danger:hover { background: #922b21; }
        button.small { padding: 4px 8px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
        th { background: #f5f5f5; }
        .hidden { display: none !important; }
        .error { color: #c0392b; margin-top: 8px; font-size: 14px; }
        .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
        .row input { margin-bottom: 0; }
        .row button { white-space: nowrap; }
        /* Стили для вкладок */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { background: none; color: #555; font-size: 16px; padding: 8px 16px; }
        .tab-btn.active { background: #2d6cdf; color: white; }
    </style>
</head>
<body>

<h1>Админ-панель Vault</h1>

<!-- Блок логина -->
<div id="login-block" class="card">
    <h2>Вход</h2>
    <label>Email</label>
    <input id="email" type="email" placeholder="admin@example.com">
    <label>Пароль</label>
    <input id="password" type="password">
    <button id="login-btn">Войти</button>
    <div id="login-error" class="error"></div>
</div>

<!-- Блок админки -->
<div id="admin-block" class="hidden">
    <div class="row" style="justify-content: space-between;">
        <h2 style="margin: 0;">Управление</h2>
        <button id="logout-btn" class="danger">Выйти</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-target="tab-clients">Клиенты</button>
        <button class="tab-btn" data-target="tab-sessions">Сессии</button>
    </div>

    <div id="admin-error" class="error"></div>

    <!-- Вкладка: Клиенты -->
    <div id="tab-clients" class="card">
        <div class="row">
            <input id="client-name" type="text" placeholder="Название приложения">
            <label style="display: flex; align-items: center; gap: 6px; margin: 0;">
                <input id="client-confidential" type="checkbox" checked style="width: auto; margin: 0;">
                Конфиденциальный
            </label>
            <button id="create-client-btn">Создать клиента</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Client ID</th>
                    <th>Название</th>
                    <th>Confidential</th>
                    <th>Active</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="clients-tbody">
                <tr><td colspan="5">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Вкладка: Сессии -->
    <div id="tab-sessions" class="card hidden">
        <h3>Активные сессии (User Sessions)</h3>
        <p style="color: #666; font-size: 14px;">Это OAuth2-сессии, созданные при входе через Demo-RP или другие приложения.</p>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Client ID</th>
                    <th>IP</th>
                    <th>User-Agent</th>
                    <th>Создана</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="sessions-tbody">
                <tr><td colspan="6">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
